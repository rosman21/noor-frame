name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Server, dashboard and companion (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  python:
    name: Pi helper and frame tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s apps/kiosk-pi/helper -q
      - run: python3 -m unittest discover -s scripts/a33-frame -q
      - run: bash -n apps/kiosk-pi/install.sh apps/kiosk-pi/bin/noor-browser apps/kiosk-pi/bin/noor-frame-update apps/kiosk-android/build.sh scripts/a33-frame/build-uboot.sh scripts/a33-frame/load-readonly-uboot.sh

  e2e:
    name: Phone companion in iPhone (WebKit) and Android (Chromium) browsers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
