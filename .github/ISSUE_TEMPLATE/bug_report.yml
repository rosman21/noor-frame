name: Bug report
description: Something doesn't work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please don't include calendar links, API keys, Wi-Fi details or device serial numbers.
        Security problems go to the Security tab instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where?
      multiple: true
      options:
        - Wall dashboard
        - Phone companion
        - Server / API
        - Raspberry Pi setup
        - Android frame app
        - Frame tooling (scripts/a33-frame)
        - Docs
  - type: input
    id: screen
    attributes:
      label: Screen and browser
      description: e.g. AEEZO PF1007L with WebView 106, Raspberry Pi 4 + official display, Chrome on a TV.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Output of `git rev-parse --short HEAD` on the server.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Server output, `journalctl -u noor-server`, or `adb logcat -d | grep NoorFrame`. Remove anything private.
      render: text
