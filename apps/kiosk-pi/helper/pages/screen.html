<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>noor-frame</title>
<!-- Shown on the Pi's own screen when the dashboard can't load yet, and for Wi-Fi setup.
     Works offline: no fonts or scripts from the internet. -->
<style>
  :root { --paper: #F2EEE6; --card: #FBF9F4; --ink: #111111; --mute: #7A756B; --line: #D6CFC0; --green: #0B7A5B; --alert: #E5261E; }
  @media (prefers-color-scheme: dark) { :root { --paper: #141311; --card: #1E1C19; --ink: #EEE9DF; --mute: #9C968A; --line: #3A3631; --green: #2FB487; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; padding: 32px; background: var(--paper); color: var(--ink);
    font: 22px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; cursor: default; user-select: none; }
  main { width: min(1100px, 100%); }
  .label { color: var(--mute); font-size: 16px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
  h1 { margin: 6px 0 10px; font: 400 60px/1.05 Georgia, 'Times New Roman', serif; }
  p { margin: 0 0 12px; max-width: 760px; }
  .muted { color: var(--mute); }
  .msg { margin: 18px 0; padding: 14px 18px; border-left: 5px solid var(--alert); background: var(--card); border-radius: 8px; }
  .steps { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 26px; }
  .step { display: flex; gap: 22px; align-items: center; padding: 22px; background: var(--card); border-radius: 18px; }
  .step .qr { flex: none; width: 190px; height: 190px; padding: 10px; background: #fff; border-radius: 12px; }
  .step .qr img { display: block; width: 100%; height: 100%; }
  .step b { display: block; font-size: 24px; }
  .num { display: inline-grid; place-items: center; width: 34px; height: 34px; margin-bottom: 8px; border-radius: 50%; background: var(--green); color: #fff; font-weight: 800; }
  code { font: 700 24px/1.3 ui-monospace, Menlo, monospace; }
  .btns { display: flex; gap: 14px; margin-top: 26px; flex-wrap: wrap; }
  button { min-height: 64px; padding: 0 28px; border: 2px solid var(--ink); border-radius: 999px; background: none; color: var(--ink);
    font: 800 18px system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; }
  button.solid { background: var(--ink); color: var(--paper); }
  .spin { display: inline-block; width: 22px; height: 22px; margin-right: 10px; border: 3px solid var(--line); border-top-color: var(--green);
    border-radius: 50%; vertical-align: -3px; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main id="app"><div class="label">noor-frame</div><h1><span class="spin"></span>Starting…</h1></main>
<script>
  // Opened by Settings → Wi-Fi on the dashboard (/kiosk/wifi), or shown automatically while the
  // dashboard can't load. In that case it goes back to the dashboard as soon as it can.
  var manual = location.pathname === '/kiosk/wifi';
  var app = document.getElementById('app');
  var last = '', current = {};

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function post(path, body) { return fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body || {}) }); }

  function view(s) {
    var msg = s.message ? '<div class="msg">' + esc(s.message) + '</div>' : '';
    if (s.joining) {
      return '<div class="label">Wi-Fi</div><h1><span class="spin"></span>Joining “' + esc(s.joining) + '”…</h1><p class="muted">This takes up to a minute.</p>';
    }
    if (s.hotspot) {
      return '<div class="label">Wi-Fi setup</div><h1>Connect this screen with your phone</h1>' + msg +
        '<div class="steps">' +
        '<div class="step"><div class="qr"><img src="/kiosk/qr/wifi.svg" width="170" height="170" alt=""></div><div><span class="num">1</span>' +
        '<b>Join the setup network</b><p>Scan with your phone’s camera, or join <b>' + esc(s.hotspotSsid) + '</b><br>password <code>' + esc(s.hotspotPassword) + '</code></p></div></div>' +
        '<div class="step"><div class="qr"><img src="/kiosk/qr/setup.svg" width="170" height="170" alt=""></div><div><span class="num">2</span>' +
        '<b>Choose your home Wi-Fi</b><p>The setup page usually opens by itself. If not, scan this or open <code>' + esc(s.setupUrl.replace('http://', '').replace(/\/$/, '')) + '</code></p></div></div>' +
        '</div>' +
        '<div class="btns"><button data-act="cancel">Cancel</button></div>';
    }
    if (!s.online) {
      return '<div class="label">No connection</div><h1>This screen isn’t on Wi-Fi</h1>' + msg +
        '<p>' + (s.secondsToHotspot != null ? 'If it doesn’t connect by itself, Wi-Fi setup starts in ' + s.secondsToHotspot + ' seconds.' : 'Set up Wi-Fi with your phone.') + '</p>' +
        '<div class="btns">' + here('Choose Wi-Fi on this screen') + '<button' + (touch ? '' : ' class="solid"') + ' data-act="setup">' + (touch ? 'Use my phone' : 'Set up Wi-Fi now') + '</button>' + (manual ? '<button data-act="back">Back to the dashboard</button>' : '') + '</div>';
    }
    if (!s.serverOk) {
      return '<div class="label">Connected to ' + esc(s.ssid || 'the network') + '</div><h1><span class="spin"></span>Looking for the noor-frame server</h1>' +
        '<p>' + (s.server ? 'Trying <code>' + esc(s.server) + '</code>. Is the server computer on?' : 'Searching your network for it. Is the server computer on and on the same Wi-Fi?') + '</p>' +
        '<div class="btns">' + here('Wi-Fi and server address') + '<button data-act="setup">Change Wi-Fi</button>' + (manual ? '<button data-act="back">Back to the dashboard</button>' : '') + '</div>';
    }
    return '<div class="label">Wi-Fi</div><h1>Connected to ' + esc(s.ssid || 'the network') + '</h1>' + msg +
      '<p class="muted">To move this screen to another network, start Wi-Fi setup and choose the new network from your phone.</p>' +
      '<div class="btns"><button class="solid" data-act="back">Back to the dashboard</button>' + here('Change Wi-Fi on this screen') + '<button data-act="setup">Change Wi-Fi with my phone</button></div>';
  }

  // A touch screen can choose Wi-Fi (and the server's address) itself, with Noor's keyboard.
  var touch = matchMedia('(any-pointer: coarse)').matches;
  function here(label) { return touch ? '<button class="solid" data-act="here">' + label + '</button>' : ''; }

  function tick() {
    fetch('/kiosk/status', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (s) {
      if (!manual && s.online && s.serverOk && !s.hotspot) { location.replace('/?kiosk=pi'); return; }
      current = s;
      var html = view(s);
      if (html !== last) { app.innerHTML = html; last = html; }
    }).catch(function () { /* helper restarting */ });
  }

  app.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b) return;
    if (b.dataset.act === 'back') location.replace('/?kiosk=pi');
    if (b.dataset.act === 'here') location.href = '/kiosk/setup?reason=' + (current.online && current.serverOk ? 'settings' : 'offline');
    if (b.dataset.act === 'cancel') post('/kiosk/hotspot', { on: false }).then(function () { manual = true; tick(); });
    if (b.dataset.act === 'setup') {
      if (current.online && !confirm('Start Wi-Fi setup? This screen leaves its current network until you choose one from your phone.')) return;
      post('/kiosk/hotspot', { on: true }).then(tick);
    }
  });
  tick();
  setInterval(tick, 3000);
</script>
</body>
</html>
